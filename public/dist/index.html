<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Tesla 播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #player-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    .empty-state {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      background-color: #0b0b0b;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #999;
      font-size: 14px;
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      color: #e50914;
    }
  </style>
  <!-- 离线本地引入 Hls.js 与 Artplayer.js -->
  <script src="/dist/hls.min.js"></script>
  <script src="/dist/artplayer.js"></script>
</head>
<body>
  <div id="player-container"></div>
  <div id="empty-state" class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <p id="tip-text">未指定播放视频地址</p>
  </div>

  <script type="module">
    import { Player } from '/dist/player-ui.js';

    // 适配 m3u8 (HLS) 播放支持
    if (window.Artplayer) {
      window.Artplayer.option = window.Artplayer.option || {};
      window.Artplayer.option.customType = window.Artplayer.option.customType || {};

      const playM3u8 = function(video, url, art) {
        if (window.Hls && window.Hls.isSupported()) {
          if (art.hls) {
            try { art.hls.destroy(); } catch (e) {}
          }
          const hls = new window.Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90,
          });
          hls.loadSource(url);
          hls.attachMedia(video);
          art.hls = hls;
          art.on('destroy', () => {
            try { hls.destroy(); } catch (e) {}
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('application/x-mpegURL')) {
          video.src = url;
        } else {
          art.notice.show = '当前车机浏览器不支持播放此格式视频';
        }
      };

      window.Artplayer.option.customType.m3u8 = playM3u8;
      window.Artplayer.option.customType['application/x-mpegURL'] = playM3u8;
      window.Artplayer.option.customType['application/vnd.apple.mpegurl'] = playM3u8;
    }

    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('url');
    const title = params.get('title');

    if (title) {
      document.title = title;
    }

    const container = document.getElementById('player-container');
    const emptyState = document.getElementById('empty-state');

    if (videoUrl) {
      try {
        const player = new Player({
          container: container,
          isLive: false,
        });
        player.loadSource(videoUrl);
        window.__player = player;

        // 监听来自父窗口的消息（例如切换集数或换源）
        window.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'CHANGE_SOURCE' && event.data.url) {
            player.loadSource(event.data.url);
          }
        });
      } catch (err) {
        console.error('[TeslaPlayer Init Error]', err);
        emptyState.style.display = 'flex';
        document.getElementById('tip-text').textContent = '播放器初始化失败: ' + err.message;
      }
    } else {
      emptyState.style.display = 'flex';
    }
  </script>
</body>
</html>
